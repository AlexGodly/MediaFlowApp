name: MediaFlowApp bench
on:
  push:
    branches: ['bench-*']
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Large-account benchmark
        env:
          TZ: UTC
        run: flutter test tool/bench/large_account_bench_test.dart --reporter expanded
