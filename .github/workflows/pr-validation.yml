name: MediaFlowApp PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mediaflowapp-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MEDIAFLOW_VERSION: '554'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Packaging unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify version and release contract
        run: python tests/release_guard.py
      - name: JavaScript syntax and cloud compare-and-swap tests
        run: |
          for f in tool/android_assets/*.js desktop/main.js desktop/preload.js; do node --check "$f"; done
          node tests/cloud-state-cas.test.cjs
      - name: Package the full website
        run: |
          mkdir -p .downloads
          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/AlexGodly/MediaFlow/releases/download/${MEDIAFLOW_VERSION}/MediaFlow_v${MEDIAFLOW_VERSION}_Stable.zip" \
            -o ".downloads/MediaFlow_v${MEDIAFLOW_VERSION}_Stable.zip"
          python tool/package_mediaflow.py
      - name: End-to-end logging test
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python tests/e2e/smoke.py app/src/main/assets/www --shots e2e-shots
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android APK
        run: |
          python tool/build_icons.py
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-${{ github.event.pull_request.number }}-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            e2e-shots
          if-no-files-found: ignore
