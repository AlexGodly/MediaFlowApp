name: Android MediaFlow v507 bundled WebView beta

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tool/package_mediaflow.py'
      - 'tool/build_icons.py'
      - 'tests/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-webview-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mediaflow-android-webview-release
  cancel-in-progress: false

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate packaging logic
        run: python -m unittest discover -s tests -v
      - name: Download immutable v507 website release
        run: |
          mkdir -p .downloads
          curl -fL --retry 4 --retry-delay 3             https://github.com/AlexGodly/MediaFlow/releases/download/507/MediaFlow_v507_Stable.zip             -o .downloads/MediaFlow_v507_Stable.zip
      - name: Verify website archive and bundle complete local frontend
        run: |
          python tool/package_mediaflow.py
          test -s app/src/main/assets/www/assets/js/mediaflow-v507.bundle.js
          test -s app/src/main/assets/www/assets/vendor/supabase-js-v2.js
      - name: Generate launcher icons from preserved original
        run: |
          python -m pip install pillow
          python tool/build_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install API 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Stage release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MediaFlow-v507-Android-WebView-beta1.apk
          cp app/src/main/assets/www/mediaflow-android-build.json dist/source-manifest.json
          (cd dist && sha256sum MediaFlow-v507-Android-WebView-beta1.apk source-manifest.json > SHA256SUMS.txt)
          test -s dist/MediaFlow-v507-Android-WebView-beta1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-v507-Android-WebView-beta1
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-webview-v1.0.0-beta.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing version tag $TAG found; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG"             dist/MediaFlow-v507-Android-WebView-beta1.apk dist/source-manifest.json dist/SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "MediaFlowApp Android v1.0.0 Beta 1 — Full v507 WebView"             --notes-file docs/releases/android-webview-v1.0.0-beta.1.md --prerelease
