name: Fresh MediaFlow native build and release
on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform templates
        run: flutter create --project-name mediaflow_app --org com.alexgodly --platforms=android,ios,windows .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Never write to user's account in foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source='\n'.join(p.read_text() for p in Path('lib').rglob('*.dart'))
          blocked=['.upsert(', '.update(', '.insert(', '.delete(', '.rpc(', 'service_role', 'sb_secret_']
          for b in blocked:
              assert b not in source, f'Unsafe cloud mutation API: {b}'
          assert "select('state_data,updated_at')" in source
          print('Read-only website cloud state and safe local Logging verified')
          PY

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter create --project-name mediaflow_app --org com.alexgodly --platforms=android .
      - name: Brand Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('android:label="mediaflow_app"', 'android:label="MediaFlow"'))
          PY
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter create --project-name mediaflow_app --org com.alexgodly --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the entire runnable Windows folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/MediaFlow-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-windows-x64
          path: dist/MediaFlow-Windows-x64.zip
          if-no-files-found: error

  ios:
    needs: check
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter create --project-name mediaflow_app --org com.alexgodly --platforms=ios .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned developer IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          cd dist
          zip -qry MediaFlow-iOS-unsigned.ipa Payload
          test -s MediaFlow-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-ios-unsigned
          path: dist/MediaFlow-iOS-unsigned.ipa
          if-no-files-found: error

  publish:
    needs: [check, android, windows, ios]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fresh-*
          path: artifacts
      - name: Verify files and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp artifacts/fresh-android-apk/app-debug.apk dist/MediaFlow-Android-debug.apk
          cp artifacts/fresh-windows-x64/MediaFlow-Windows-x64.zip dist/
          cp artifacts/fresh-ios-unsigned/MediaFlow-iOS-unsigned.ipa dist/
          (cd dist && sha256sum MediaFlow-* > SHA256SUMS.txt)
          TAG="fresh-v0.1.0-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release found; refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" dist/* --title "MediaFlowApp Fresh Start Beta 1 — Cloud + Logging" \
            --notes-file README.md --prerelease --target "$GITHUB_SHA"
