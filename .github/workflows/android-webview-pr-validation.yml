name: Android MediaFlow v553 PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'tool/android_assets/**'
      - 'tool/package_mediaflow.py'
      - 'tool/verify_release_archive.py'
      - 'tool/build_icons.py'
      - 'tests/**'
      - '.github/workflows/android-webview-pr-validation.yml'

permissions:
  contents: read

concurrency:
  group: mediaflow-android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run package and regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify version and release contract
        run: python tests/release_guard.py
      - name: Verify exact source archive
        run: python tool/verify_release_archive.py --tag android-webview-v1.0.0-beta.10
      - name: Check JavaScript and cloud CAS behavior
        run: |
          node --check tool/android_assets/backup-bridge.js
          node --check tool/android_assets/performance-boot.js
          node --check tool/android_assets/performance-settings.js
          node --check tool/android_assets/cloud-state-cas.js
          node --check tool/android_assets/companion-mode.js
          node tests/cloud-state-cas.test.cjs
      - name: Download pinned MediaFlow v553
        run: |
          mkdir -p .downloads
          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/AlexGodly/MediaFlow/releases/download/553/MediaFlow_v553_Stable.zip \
            -o .downloads/MediaFlow_v553_Stable.zip
      - name: Package and verify the actual v553 frontend
        run: |
          python tool/package_mediaflow.py
          test -s app/src/main/assets/www/assets/js/mediaflow-v553.bundle.js
          test -s app/src/main/assets/www/assets/android/cloud-state-cas.js
          test -s app/src/main/assets/www/assets/android/companion-mode.js
          node --check app/src/main/assets/www/assets/js/mediaflow-v553.bundle.js
          node --check app/src/main/assets/www/assets/android/cloud-state-cas.js
          node --check app/src/main/assets/www/assets/android/companion-mode.js
      - name: Generate launcher icons
        run: |
          python -m pip install pillow
          python tool/build_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable Beta 10 APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK package and version
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-v553-Android-Beta10-PR-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
