name: Flutter native validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate native platform templates on CI host
        run: flutter create --project-name mediaflow_app --platforms=android,ios,windows .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze
      - name: Run automated tests
        run: flutter test

# Validation only. Unconfigured or unsigned apps are not released.
