name: mediaflow
description: MediaFlow by Alex Godly — native app for Android, Windows and iOS.
publish_to: none

# Build number = beta number. The user-visible label lives in lib/src/config.dart.
version: 4.0.0+22

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  # Daily streak reminder (Android, iOS, Windows).
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  # Windows: tray icon, keep running when closed, start with Windows.
  tray_manager: ^0.5.0
  window_manager: ^0.5.0
  launch_at_startup: ^0.5.1
  # Discord Rich Presence: the Social SDK's C interface, and the linked
  # account's tokens kept in the system's secure storage (phones).
  ffi: ^2.1.3
  flutter_secure_storage: ^9.2.2
  # Long-press shortcuts on the app icon (Android, iOS).
  quick_actions: ^1.0.7
  # Category icons given as SVG links (website v144 icon URLs).
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mediaflow-launcher-512.png
    - assets/branding/mediaflow-logo-rounded-512.png
    - assets/branding/mediaflow-tray.ico
    - assets/branding/mediaflow-tray.png
