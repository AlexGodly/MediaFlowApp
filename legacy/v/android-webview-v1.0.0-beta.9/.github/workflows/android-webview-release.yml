name: Android MediaFlow v553 bundled WebView beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mediaflow-android-webview-release
  cancel-in-progress: true

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate packaging logic
        run: python -m unittest discover -s tests -v
      - name: Verify generated Android version and release contract
        run: python tests/release_guard.py
      - name: Require complete and byte-identical legacy source archive
        run: python tool/verify_release_archive.py --tag android-webview-v1.0.0-beta.9
      - name: Verify Android backup bridge JavaScript syntax
        run: node --check tool/android_assets/backup-bridge.js
      - name: Verify phone optimization JavaScript syntax
        run: |
          node --check tool/android_assets/performance-boot.js
          node --check tool/android_assets/performance-settings.js
      - name: Validate companion JavaScript syntax
        run: node --check tool/android_assets/companion-mode.js
      - name: Download immutable v553 website release
        run: |
          mkdir -p .downloads
          curl -fL --retry 4 --retry-delay 3             https://github.com/AlexGodly/MediaFlow/releases/download/553/MediaFlow_v553_Stable.zip             -o .downloads/MediaFlow_v553_Stable.zip
      - name: Verify website archive and bundle complete local frontend
        run: |
          python tool/package_mediaflow.py
          test -s app/src/main/assets/www/assets/js/mediaflow-v553.bundle.js
          test -s app/src/main/assets/www/assets/vendor/supabase-js-v2.js
          test -s app/src/main/assets/www/assets/android/performance-boot.js
          node --check app/src/main/assets/www/assets/js/mediaflow-v553.bundle.js
          node --check app/src/main/assets/www/assets/android/companion-mode.js
          test -s app/src/main/assets/www/assets/android/companion-mode.css
      - name: Generate launcher icons from preserved original
        run: |
          python -m pip install pillow
          python tool/build_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install API 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists and can be inspected
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5
      - name: Stage release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MediaFlow-v553-Android-WebView-beta9.apk
          cp app/src/main/assets/www/mediaflow-android-build.json dist/source-manifest.json
          zip -qr dist/MediaFlow-v553-Android-source-beta9.zip legacy/v/android-webview-v1.0.0-beta.9
          test -s dist/MediaFlow-v553-Android-source-beta9.zip
          (cd dist && sha256sum MediaFlow-v553-Android-WebView-beta9.apk source-manifest.json MediaFlow-v553-Android-source-beta9.zip > SHA256SUMS.txt)
          test -s dist/MediaFlow-v553-Android-WebView-beta9.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-v553-Android-WebView-beta9
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-webview-v1.0.0-beta.9
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing version tag $TAG found; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG"             dist/MediaFlow-v553-Android-WebView-beta9.apk dist/source-manifest.json dist/MediaFlow-v553-Android-source-beta9.zip dist/SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "MediaFlowApp Android v1.0.0 Beta 9 — MediaFlow v553 Companion with Offline Sync"             --notes-file docs/releases/android-webview-v1.0.0-beta.9.md --prerelease
