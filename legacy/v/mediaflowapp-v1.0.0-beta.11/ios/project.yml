# XcodeGen spec for the MediaFlow iOS app. CI runs `xcodegen generate` to create
# MediaFlow.xcodeproj, after copying the packaged website into ios/www.
name: MediaFlow
options:
  bundleIdPrefix: com.alexgodly
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "11"
targets:
  MediaFlow:
    type: application
    platform: iOS
    sources:
      - path: MediaFlow
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MediaFlow
        PRODUCT_BUNDLE_IDENTIFIER: com.alexgodly.mediaflow
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MediaFlow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # UIKit app-delegate window lifecycle (no scene manifest).
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "MediaFlow lets you choose cover images and backup files."
        INFOPLIST_KEY_NSCameraUsageDescription: "MediaFlow can use the camera when you choose to take a cover photo."
        ENABLE_BITCODE: NO
schemes:
  MediaFlow:
    build:
      targets:
        MediaFlow: all
    run:
      config: Debug
    archive:
      config: Release
